name: Build Windows EXE

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build EXE
        run: pyinstaller --onefile --windowed --add-data="background1.gif;." --add-data="fruit1w.gif;." --add-data="fruit2a.gif;." --add-data="fruit3o.gif;." --add-data="player1.gif;." dodge.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: dodge-windows
          path: dist/dodge.exe
